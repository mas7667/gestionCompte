name: CI/CD

on:
  push:
    branches: [ "dev", "test", "main" ]
  pull_request:
    branches: [ "dev", "test", "main" ]

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v5

      - name: Installer JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compiler et lancer les tests
        run: mvn -B verify

      - name: Publier les résultats de tests
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Résultats des tests
          path: '**/surefire-reports/*.xml'
          reporter: java-junit

  promote-to-test:
    needs: build-and-test
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v5

      - name: Créer et auto-fusionner la PR dev → test
        run: |
          gh pr create \
            --base test \
            --head dev \
            --title "Promotion automatique : dev → test" \
            --body "PR créée et fusionnée automatiquement après succès du build-and-test sur dev." \
            || echo "Une PR existe peut-être déjà, on continue."

          gh pr merge dev --squash --auto \
            || gh pr merge --squash --auto --head dev --base test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker-image:
    needs: build-and-test
    if: github.ref == 'refs/heads/test' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v5

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gestion-compte:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/gestion-compte:${{ github.sha }}

  promote-to-main:
    needs: build-docker-image
    if: github.ref == 'refs/heads/test' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v5

      - name: Créer et auto-fusionner la PR test → main
        run: |
          gh pr create \
            --base main \
            --head test \
            --title "Promotion automatique : test → main" \
            --body "PR créée et fusionnée automatiquement après succès du build-docker-image sur test." \
            || echo "Une PR existe peut-être déjà, on continue."

          gh pr merge test --squash --auto \
            || gh pr merge --squash --auto --head test --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build-docker-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le déploiement sur Render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"