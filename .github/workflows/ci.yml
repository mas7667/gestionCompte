name: CI/CD

on:
  push:
    branches: [ "dev", "test", "main" ]
  pull_request:
    branches: [ "dev", "test", "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compiler et lancer les tests
        run: mvn -B verify

      - name: Publier les résultats de tests
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Résultats des tests
          path: '**/surefire-reports/*.xml'
          reporter: java-junit

  promote-to-test:
    needs: build-and-test
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Créer la Pull Request dev → test
        run: |
          gh pr create \
            --base test \
            --head dev \
            --title "Promotion automatique : dev → test" \
            --body "PR créée automatiquement après succès du build-and-test sur dev." \
            || echo "Une PR existe peut-être déjà, on continue."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build-docker-image:
    needs: build-and-test
    if: github.ref == 'refs/heads/test' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gestion-compte:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/gestion-compte:${{ github.sha }}

  deploy:
    needs: build-docker-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Déploiement
        run: echo " Déploiement "