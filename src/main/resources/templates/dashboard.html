<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord — GestionCompte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        desjardins: { 50: '#EAF7EF', 500: '#00A651', 600: '#00854E', 700: '#00693E', 900: '#00341C' },
                        neutral: { 100: '#F4F6F5', 600: '#5B615D', 900: '#1A1D1B' },
                        error: { 700: '#B3261E' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['"IBM Plex Mono"', 'monospace'] }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-neutral-100 text-neutral-900">

<a href="#main" class="sr-only focus:not-sr-only fixed top-2 left-2 bg-desjardins-700 text-white px-4 py-2 rounded z-50">
    Aller au contenu principal
</a>

<header class="bg-desjardins-700 text-white">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
        <span class="font-bold text-lg">GestionCompte</span>
        <button id="logoutBtn"
                class="text-sm font-medium bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-white">
            Se déconnecter
        </button>
    </div>
</header>

<main id="main" class="max-w-5xl mx-auto px-4 py-8 space-y-6">

    <div role="alert" aria-live="polite" id="globalMessage" class="text-sm min-h-[1.25rem]"></div>

    <!-- Solde -->
    <section class="bg-white rounded-xl shadow-sm border border-neutral-100 overflow-hidden">
        <div class="h-1.5 bg-gradient-to-r from-desjardins-500 to-desjardins-700"></div>
        <div class="p-6">
            <h1 class="text-sm font-medium text-neutral-600 mb-1">Solde du compte</h1>
            <p id="accountNumberDisplay" class="text-xs text-neutral-600 font-mono mb-3">—</p>
            <p id="balanceDisplay" class="text-4xl font-bold font-mono text-desjardins-900">—</p>
        </div>
    </section>

    <!-- Actions -->
    <section class="bg-white rounded-xl shadow-sm border border-neutral-100 p-6">
        <h2 class="text-lg font-semibold text-neutral-900 mb-4">Effectuer une opération</h2>

        <div class="flex gap-2 mb-4" role="tablist" aria-label="Type d'opération">
            <button type="button" data-op="deposit" class="op-tab px-4 py-2 rounded-lg text-sm font-medium bg-desjardins-700 text-white" aria-selected="true" role="tab">Dépôt</button>
            <button type="button" data-op="withdraw" class="op-tab px-4 py-2 rounded-lg text-sm font-medium bg-neutral-100 text-neutral-900" aria-selected="false" role="tab">Retrait</button>
            <button type="button" data-op="transfer" class="op-tab px-4 py-2 rounded-lg text-sm font-medium bg-neutral-100 text-neutral-900" aria-selected="false" role="tab">Virement</button>
        </div>

        <form id="transactionForm" class="space-y-4" novalidate>
            <div>
                <label for="amount" class="block text-sm font-medium text-neutral-900 mb-1">Montant ($)</label>
                <input type="number" id="amount" name="amount" step="0.01" min="0.01" required
                       class="w-full max-w-xs rounded-lg border border-neutral-600/30 px-4 py-2.5 font-mono focus:outline-none focus:ring-2 focus:ring-desjardins-600 focus:border-desjardins-600">
            </div>

            <div id="destinationField" class="hidden">
                <label for="destinationAccountNumber" class="block text-sm font-medium text-neutral-900 mb-1">Compte destinataire</label>
                <input type="text" id="destinationAccountNumber" name="destinationAccountNumber"
                       class="w-full max-w-xs rounded-lg border border-neutral-600/30 px-4 py-2.5 font-mono focus:outline-none focus:ring-2 focus:ring-desjardins-600 focus:border-desjardins-600">
            </div>

            <div role="alert" aria-live="polite" id="formError" class="text-error-700 text-sm min-h-[1.25rem]"></div>

            <button type="submit" id="submitBtn"
                    class="bg-desjardins-700 hover:bg-desjardins-900 text-white font-semibold px-6 py-2.5 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-desjardins-600 focus:ring-offset-2">
                Confirmer le dépôt
            </button>
        </form>
    </section>

    <!-- Historique -->
    <section class="bg-white rounded-xl shadow-sm border border-neutral-100 p-6">
        <h2 class="text-lg font-semibold text-neutral-900 mb-4">Historique des transactions</h2>
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <caption class="sr-only">Liste des transactions récentes du compte</caption>
                <thead>
                <tr class="text-left text-neutral-600 border-b border-neutral-100">
                    <th scope="col" class="py-2 pr-4 font-medium">Date</th>
                    <th scope="col" class="py-2 pr-4 font-medium">Type</th>
                    <th scope="col" class="py-2 pr-4 font-medium text-right">Montant</th>
                    <th scope="col" class="py-2 font-medium text-right">Solde après</th>
                </tr>
                </thead>
                <tbody id="historyBody">
                <tr><td colspan="4" class="py-6 text-center text-neutral-600">Chargement…</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script>
    const token = localStorage.getItem('token');
    const accountNumber = localStorage.getItem('accountNumber');

    if (!token || !accountNumber) {
        window.location.href = '/login';
    }

    const authHeaders = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
    let currentAccountId = null;
    let currentOp = 'deposit';

    const typeLabels = {
        DEPOSIT: 'Dépôt', WITHDRAWAL: 'Retrait',
        TRANSFER_OUT: 'Virement envoyé', TRANSFER_IN: 'Virement reçu'
    };

    function formatMoney(value) {
        return new Intl.NumberFormat('fr-CA', { style: 'currency', currency: 'CAD' }).format(value);
    }

    function formatDate(iso) {
        return new Intl.DateTimeFormat('fr-CA', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(iso));
    }

    async function loadAccount() {
        const res = await fetch('/api/accounts/' + accountNumber, { headers: authHeaders });
        if (!res.ok) { handleAuthError(res); return; }
        const account = await res.json();
        currentAccountId = account.id;
        document.getElementById('accountNumberDisplay').textContent = 'Compte n° ' + account.accountNumber;
        document.getElementById('balanceDisplay').textContent = formatMoney(account.balance);
        loadHistory();
    }

    async function loadHistory() {
        const body = document.getElementById('historyBody');
        const res = await fetch('/api/transactions/account/' + currentAccountId + '?size=15', { headers: authHeaders });
        if (!res.ok) { handleAuthError(res); return; }
        const page = await res.json();

        if (!page.content || page.content.length === 0) {
            body.innerHTML = '<tr><td colspan="4" class="py-6 text-center text-neutral-600">Aucune transaction pour le moment.</td></tr>';
            return;
        }

        body.innerHTML = page.content.map(tx => `
                <tr class="border-b border-neutral-100 last:border-0">
                    <td class="py-2.5 pr-4 text-neutral-600">${formatDate(tx.transactionDate)}</td>
                    <td class="py-2.5 pr-4">${typeLabels[tx.type] || tx.type}</td>
                    <td class="py-2.5 pr-4 text-right font-mono">${formatMoney(tx.amount)}</td>
                    <td class="py-2.5 text-right font-mono text-neutral-600">${formatMoney(tx.balanceAfterTransaction)}</td>
                </tr>
            `).join('');
    }

    function handleAuthError(res) {
        if (res.status === 401 || res.status === 403) {
            localStorage.clear();
            window.location.href = '/login';
        }
    }

    document.querySelectorAll('.op-tab').forEach(btn => {
        btn.addEventListener('click', () => {
            currentOp = btn.dataset.op;
            document.querySelectorAll('.op-tab').forEach(b => {
                b.classList.remove('bg-desjardins-700', 'text-white');
                b.classList.add('bg-neutral-100', 'text-neutral-900');
                b.setAttribute('aria-selected', 'false');
            });
            btn.classList.add('bg-desjardins-700', 'text-white');
            btn.classList.remove('bg-neutral-100', 'text-neutral-900');
            btn.setAttribute('aria-selected', 'true');

            document.getElementById('destinationField').classList.toggle('hidden', currentOp !== 'transfer');
            const labels = { deposit: 'Confirmer le dépôt', withdraw: 'Confirmer le retrait', transfer: 'Confirmer le virement' };
            document.getElementById('submitBtn').textContent = labels[currentOp];
        });
    });

    document.getElementById('transactionForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById('formError');
        const globalEl = document.getElementById('globalMessage');
        errorEl.textContent = '';
        globalEl.textContent = '';

        const amount = document.getElementById('amount').value;
        const destinationAccountNumber = document.getElementById('destinationAccountNumber').value;

        const payload = { accountNumber, amount };
        if (currentOp === 'transfer') payload.destinationAccountNumber = destinationAccountNumber;

        try {
            const res = await fetch('/api/transactions/' + currentOp, {
                method: 'POST', headers: authHeaders, body: JSON.stringify(payload)
            });

            if (!res.ok) {
                const error = await res.json().catch(() => ({}));
                errorEl.textContent = error.message || "L'opération a échoué.";
                return;
            }

            document.getElementById('transactionForm').reset();
            globalEl.textContent = 'Opération effectuée avec succès.';
            globalEl.classList.add('text-desjardins-700');
            loadAccount();
        } catch (err) {
            errorEl.textContent = 'Erreur réseau. Vérifiez votre connexion et réessayez.';
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = '/login';
    });

    loadAccount();
</script>
</body>
</html>
