<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Inscription — GestionCompte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
</head>
<body class="min-h-screen flex items-center justify-center bg-base-200">

<div class="card w-96 bg-base-100 shadow-xl">
    <div class="card-body">
        <h1 class="card-title text-2xl mb-4">Créer un compte</h1>

        <form id="registerForm" class="flex flex-col gap-3">
            <label class="form-control">
                <span class="label-text">Nom complet</span>
                <input type="text" id="fullName" class="input input-bordered" required>
            </label>

            <label class="form-control">
                <span class="label-text">Email</span>
                <input type="email" id="email" class="input input-bordered" required>
            </label>

            <label class="form-control">
                <span class="label-text">Mot de passe</span>
                <input type="password" id="password" class="input input-bordered" required minlength="8">
            </label>

            <button type="submit" class="btn btn-primary mt-2">S'inscrire</button>
        </form>

        <p id="errorMessage" class="text-error text-sm mt-2"></p>

        <p class="text-sm mt-4">Déjà un compte ? <a href="/login" class="link link-primary">Se connecter</a></p>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const fullName = document.getElementById('fullName').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fullName, email, password })
            });

            if (!response.ok) {
                const error = await response.json();
                document.getElementById('errorMessage').textContent = error.message || 'Erreur lors de l\'inscription.';
                return;
            }

            const data = await response.json();
            localStorage.setItem('token', data.token);
            localStorage.setItem('accountNumber', data.accountNumber);

            window.location.href = '/dashboard';
        } catch (err) {
            document.getElementById('errorMessage').textContent = 'Erreur réseau.';
        }
    });
</script>
</body>
</html>
